name: Temporary events CRUD status patch

on:
  push:
    branches:
      - rc1-rebuild
    paths:
      - .github/workflows/temp-events-crud-status.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch_events_crud_status.py
      - name: Format
        run: dart format apps/mobile/lib/screens/events_module_screen.dart apps/mobile/lib/screens/events_screen.dart
      - name: Commit
        run: |
          rm .github/workflows/temp-events-crud-status.yml
          rm .github/scripts/patch_events_crud_status.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(events): filter status and delete events safely"
          git push origin HEAD:rc1-rebuild
