name: Temporary management event details

on:
  push:
    branches:
      - rc1-rebuild
    paths:
      - .github/workflows/temp-management-event-details.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: rc1-rebuild
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Patch source
        run: python3 .github/scripts/patch_management_event_details.py

      - name: Validate
        working-directory: apps/mobile
        run: |
          flutter pub get
          dart format lib/screens/events_module_screen.dart
          flutter analyze
          flutter test

      - name: Commit fix
        run: |
          rm .github/workflows/temp-management-event-details.yml
          rm .github/scripts/patch_management_event_details.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(events): show complete event details in management"
          git push origin HEAD:rc1-rebuild
