name: Deploy BOB Manager Web

on:
  push:
    branches: [rc1-rebuild]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build production web
        run: >-
          flutter build web --release
          --dart-define=SUPABASE_URL=https://vgjwghzypumtxvbuhwwl.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_cLA9Z8l0snOZu4QEk4YGAA_nPlfK2DM

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
