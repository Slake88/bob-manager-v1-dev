name: Temporary management event delete patch

on:
  push:
    branches: [rc1-rebuild]
    paths:
      - '.github/workflows/temp-management-event-delete.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild
          fetch-depth: 0
      - name: Patch management event screen
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/mobile/lib/screens/events_module_screen.dart')
          text = path.read_text(encoding='utf-8')

          import_anchor = "import '../core/app_session.dart';\n"
          permissions_import = "import '../core/permissions.dart';\n"
          if permissions_import not in text:
              if import_anchor not in text:
                  raise SystemExit('app_session import anchor not found')
              text = text.replace(import_anchor, import_anchor + permissions_import, 1)

          open_start = text.index('  Future<void> _openEvent(Map<String, dynamic> event) async {')
          open_end = text.index('\n  @override\n  Widget build(BuildContext context) {', open_start)
          open_method = '''  Future<void> _openEvent(Map<String, dynamic> event) async {
            final deleted = await Navigator.of(context).push<bool>(
              MaterialPageRoute<bool>(
                builder: (_) => EventAdvancedScreen(
                  event: event,
                  repository: _advanced,
                ),
              ),
            );
            if (!mounted) return;
            setState(_reload);
            if (deleted == true) {
              _snack(context, 'Evento eliminado.');
            }
          }
          '''
          text = text[:open_start] + open_method + text[open_end:]

          state_start = text.index('class _EventAdvancedScreenState extends State<EventAdvancedScreen> {')
          future_anchor = '  late Future<Map<String, dynamic>> _future;\n\n  String get _eventId => widget.event[\'id\'].toString();\n'
          state_replacement = '''  final EventsRepository _events = EventsRepository();
            late Future<Map<String, dynamic>> _future;
            bool _deleting = false;

            String get _eventId => widget.event['id'].toString();
            bool get _canManageEvent =>
                AppSession.instance.can(AppPermission.manageEvents);
          '''
          state_end = text.index('\n  @override\n  void initState()', state_start)
          current_header = text[state_start + len('class _EventAdvancedScreenState extends State<EventAdvancedScreen> {\n'):state_end]
          if '_canManageEvent' not in current_header:
              text = (
                  text[:state_start + len('class _EventAdvancedScreenState extends State<EventAdvancedScreen> {\n')]
                  + state_replacement
                  + text[state_end:]
              )

          state_start = text.index('class _EventAdvancedScreenState extends State<EventAdvancedScreen> {')
          build_pos = text.index('\n  @override\n  Widget build(BuildContext context) {', state_start)
          if 'Future<void> _deleteEvent() async' not in text[state_start:build_pos]:
              delete_method = '''
            Future<void> _deleteEvent() async {
              if (_deleting || !_canManageEvent) return;
              final eventName =
                  widget.event['name']?.toString().trim().isNotEmpty == true
                      ? widget.event['name'].toString().trim()
                      : 'este evento';
              final confirmed = await showDialog<bool>(
                context: context,
                builder: (confirmContext) => AlertDialog(
                  title: const Text('Eliminar evento'),
                  content: Text(
                    'Queres eliminar o evento “$eventName”?\n\n'
                    'Roadbooks, paragens, participantes, voluntários, turnos, tarefas e outros dados operacionais associados serão eliminados. '
                    'Registos financeiros ou de inventário relacionados são preservados, mas deixam de ficar associados ao evento.\n\n'
                    'Esta ação não pode ser anulada.',
                  ),
                  actions: [
                    TextButton(
                      onPressed: () => Navigator.pop(confirmContext, false),
                      child: const Text('Cancelar'),
                    ),
                    FilledButton(
                      style: FilledButton.styleFrom(
                        backgroundColor: Theme.of(confirmContext).colorScheme.error,
                        foregroundColor: Theme.of(confirmContext).colorScheme.onError,
                      ),
                      onPressed: () => Navigator.pop(confirmContext, true),
                      child: const Text('Eliminar'),
                    ),
                  ],
                ),
              );
              if (confirmed != true || !mounted) return;

              setState(() => _deleting = true);
              try {
                await _events.deleteEvent(_eventId);
                if (!mounted) return;
                Navigator.of(context).pop(true);
              } catch (error) {
                if (!mounted) return;
                setState(() => _deleting = false);
                _snack(context, _friendly(error));
              }
            }
          '''
              text = text[:build_pos] + delete_method + text[build_pos:]

          state_start = text.index('class _EventAdvancedScreenState extends State<EventAdvancedScreen> {')
          rock = text.index("                title: 'Rock & Ride In',", state_start)
          list_end = text.index('            ],\n          );', rock)
          delete_card = '''              if (_canManageEvent) ...[
                const SizedBox(height: 12),
                Card(
                  child: ListTile(
                    leading: Icon(
                      Icons.delete_outline,
                      color: Theme.of(context).colorScheme.error,
                    ),
                    title: Text(
                      'Eliminar evento',
                      style: TextStyle(
                        color: Theme.of(context).colorScheme.error,
                        fontWeight: FontWeight.w600,
                      ),
                    ),
                    subtitle: const Text(
                      'Remove este evento e os dados operacionais associados.',
                    ),
                    trailing: _deleting
                        ? const SizedBox(
                            width: 20,
                            height: 20,
                            child: CircularProgressIndicator(strokeWidth: 2),
                          )
                        : Icon(
                            Icons.chevron_right,
                            color: Theme.of(context).colorScheme.error,
                          ),
                    onTap: _deleting ? null : _deleteEvent,
                  ),
                ),
              ],
          '''
          if "title: Text(\n                      'Eliminar evento'" not in text[state_start:list_end]:
              text = text[:list_end] + delete_card + text[list_end:]

          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/temp-management-event-delete.yml
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/screens/events_module_screen.dart .github/workflows/temp-management-event-delete.yml
          git commit -m "fix(events): expose event deletion in management"
          git push origin rc1-rebuild
