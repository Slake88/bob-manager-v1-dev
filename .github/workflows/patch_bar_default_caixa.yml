name: Patch Bar default Caixa

on:
  push:
    branches: [rc1-rebuild]
    paths:
      - '.github/workflows/patch_bar_default_caixa.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild
      - name: Set Caixa as visible default account
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile/lib/screens/bar_screen_v3.dart')
          text = path.read_text(encoding='utf-8')
          old = "a['name']?.toString().toLowerCase() == 'club house'"
          new = "a['name']?.toString().toLowerCase() == 'caixa'"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Esperava 2 ocorrências, encontrei {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          print('Corrigidas 2 ocorrências: Compra e Venda.')
          PY
          git diff --check
          git diff -- apps/mobile/lib/screens/bar_screen_v3.dart
      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/screens/bar_screen_v3.dart
          git commit -m "RC1: predefinir Caixa no seletor financeiro do Bar"
          git push origin HEAD:rc1-rebuild
