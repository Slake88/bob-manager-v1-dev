name: Patch Assets Phase2A lints
on:
  push:
    branches: [rc1-rebuild]
    paths:
      - '.github/workflows/patch_assets_phase2a_lints.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild
      - name: Fix analyzer braces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('apps/mobile/lib/screens/assets_phase2_screen.dart')
          s=p.read_text(encoding='utf-8')
          s=s.replace("if(d!=null)setState(()=>expected=d);", "if(d!=null){setState(()=>expected=d);}")
          s=s.replace("if(d!=null)setState(()=>date=d);", "if(d!=null){setState(()=>date=d);}")
          s=s.replace("if(d!=null)setState(()=>nextDue=d);", "if(d!=null){setState(()=>nextDue=d);}")
          s=s.replace("if(v==true)selected.add(id);else selected.remove(id);", "if(v==true){selected.add(id);}else{selected.remove(id);}")
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git add apps/mobile/lib/screens/assets_phase2_screen.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "RC1: corrigir lints Património fase 2A"
          git push origin HEAD:rc1-rebuild
