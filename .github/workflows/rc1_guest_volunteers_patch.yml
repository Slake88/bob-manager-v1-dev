name: RC1 Guest Volunteers Patch

on:
  push:
    branches:
      - rc1-rebuild
    paths:
      - .github/workflows/rc1_guest_volunteers_patch.yml
      - .github/scripts/rc1_guest_volunteers_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild

      - name: Apply companion volunteer integration
        run: python3 .github/scripts/rc1_guest_volunteers_patch.py

      - name: Remove temporary helpers
        run: git rm .github/workflows/rc1_guest_volunteers_patch.yml .github/scripts/rc1_guest_volunteers_patch.py

      - name: Commit companion volunteer support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/repositories/events_repository.dart apps/mobile/lib/repositories/events_advanced_repository.dart apps/mobile/lib/screens/events_agenda_v2_screen.dart apps/mobile/lib/screens/events_module_screen.dart
          git diff --cached --check
          git commit -m "feat(events): support companion volunteers end to end"
          git push origin HEAD:rc1-rebuild
