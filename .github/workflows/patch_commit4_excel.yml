name: Patch Commit 4 Excel
on:
  push:
    branches: [rc1-rebuild]
    paths:
      - '.github/workflows/patch_commit4_excel.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild
      - name: Adapt Excel exporter to XlsIO
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/mobile/lib/screens/treasury_reports_screen.dart')
          s = p.read_text(encoding='utf-8')
          s = s.replace("import 'package:excel/excel.dart' as ex;", "import 'package:syncfusion_flutter_xlsio/xlsio.dart' as xlsio;")
          start = s.index('  Future<void> _exportExcel(TreasuryReportData data) async {')
          end = s.index('\n  Future<void> _shareBytes', start)
          new = '''  Future<void> _exportExcel(TreasuryReportData data) async {
    final workbook = xlsio.Workbook(2);
    try {
      final sheet = workbook.worksheets[0];
      sheet.name = 'Extrato';
      const headers = [
        'Data',
        'Tipo',
        'Descrição',
        'Conta',
        'Conta destino',
        'Centro de custo',
        'Valor',
      ];
      for (var column = 0; column < headers.length; column++) {
        sheet.getRangeByIndex(1, column + 1).setText(headers[column]);
      }
      for (var index = 0; index < data.movements.length; index++) {
        final row = data.movements[index];
        final excelRow = index + 2;
        sheet.getRangeByIndex(excelRow, 1).setText(row['transaction_date']?.toString() ?? '');
        sheet.getRangeByIndex(excelRow, 2).setText(_kindLabel(row['kind']?.toString()));
        sheet.getRangeByIndex(excelRow, 3).setText(row['description']?.toString() ?? '');
        sheet.getRangeByIndex(excelRow, 4).setText(row['account_name']?.toString() ?? '');
        sheet.getRangeByIndex(excelRow, 5).setText(row['destination_account_name']?.toString() ?? '');
        sheet.getRangeByIndex(excelRow, 6).setText(row['cost_center_name']?.toString() ?? '');
        sheet.getRangeByIndex(excelRow, 7).setNumber(_signed(row));
      }
      sheet.getRangeByName('A1:G1').cellStyle.bold = true;
      sheet.getRangeByName('A:G').autoFitColumns();

      final summary = workbook.worksheets[1];
      summary.name = 'Resumo';
      final summaryRows = <(String, Object)>[
        ('Período', '${_date(_from)} a ${_date(_to)}'),
        ('Saldo inicial', data.openingBalance),
        ('Receitas', data.income),
        ('Despesas', data.expense),
        ('Resultado', data.result),
        ('Saldo final', data.closingBalance),
      ];
      for (var index = 0; index < summaryRows.length; index++) {
        final item = summaryRows[index];
        summary.getRangeByIndex(index + 1, 1).setText(item.$1);
        if (item.$2 is num) {
          summary.getRangeByIndex(index + 1, 2).setNumber((item.$2 as num).toDouble());
        } else {
          summary.getRangeByIndex(index + 1, 2).setText(item.$2.toString());
        }
      }
      summary.getRangeByName('A1:A6').cellStyle.bold = true;
      summary.getRangeByName('A:B').autoFitColumns();

      final bytes = Uint8List.fromList(workbook.saveAsStream());
      await _shareBytes(
        bytes,
        _fileName('xlsx'),
        'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet',
      );
    } finally {
      workbook.dispose();
    }
  }
'''
          s = s[:start] + new + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git add apps/mobile/lib/screens/treasury_reports_screen.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: adaptar exportação Excel do Commit 4"
          git push origin HEAD:rc1-rebuild