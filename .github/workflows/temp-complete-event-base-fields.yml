name: Temporary complete event base fields

on:
  push:
    branches: [rc1-rebuild]
    paths:
      - '.github/workflows/temp-complete-event-base-fields.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Patch base event fields
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          screen = Path('apps/mobile/lib/screens/events_agenda_v2_screen.dart')
          text = screen.read_text(encoding='utf-8')

          old = """    final budget = TextEditingController(\n      text: event?['budget'] == null ? '' : event!['budget'].toString(),\n    );\n    DateTime? startsAt = _parseDate(event?['starts_at']);\n    String status = _normalizeStatus(event?['status']?.toString());\n    bool saving = false;\n"""
          new = """    final budget = TextEditingController(\n      text: event?['budget'] == null ? '' : event!['budget'].toString(),\n    );\n    final capacity = TextEditingController(\n      text: event?['capacity'] == null ? '' : event!['capacity'].toString(),\n    );\n    DateTime? startsAt = _parseDate(event?['starts_at']);\n    DateTime? endsAt = _parseDate(event?['ends_at']);\n    String eventKind = _normalizeEventKind(event?['event_kind']?.toString());\n    String status = _normalizeStatus(event?['status']?.toString());\n    bool saving = false;\n"""
          if text.count(old) != 1:
              raise SystemExit(f'editor variables anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = """                  const SizedBox(height: 10),\n                  TextField(\n                    controller: location,\n"""
          new = """                  const SizedBox(height: 10),\n                  DropdownButtonFormField<String>(\n                    initialValue: eventKind,\n                    decoration: const InputDecoration(\n                      labelText: 'Tipo de evento',\n                      prefixIcon: Icon(Icons.category_outlined),\n                    ),\n                    items: const [\n                      DropdownMenuItem(\n                        value: 'general',\n                        child: Text('Evento'),\n                      ),\n                      DropdownMenuItem(\n                        value: 'ride',\n                        child: Text('Passeio'),\n                      ),\n                      DropdownMenuItem(\n                        value: 'rock_ride_in',\n                        child: Text('Rock & Ride In'),\n                      ),\n                    ],\n                    onChanged: saving\n                        ? null\n                        : (value) {\n                            if (value != null) {\n                              setDialogState(() => eventKind = value);\n                            }\n                          },\n                  ),\n                  const SizedBox(height: 10),\n                  TextField(\n                    controller: location,\n"""
          if text.count(old) != 1:
              raise SystemExit(f'type insertion anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          text = text.replace("labelText: 'Data e hora',", "labelText: 'Início — data e hora',", 1)
          text = text.replace("? 'Selecionar data e hora'", "? 'Selecionar início'", 1)

          old = """                  const SizedBox(height: 10),\n                  TextField(\n                    controller: description,\n"""
          new = """                  const SizedBox(height: 10),\n                  InkWell(\n                    borderRadius: BorderRadius.circular(12),\n                    onTap: saving\n                        ? null\n                        : () async {\n                            final initial = endsAt ??\n                                startsAt?.add(const Duration(hours: 2)) ??\n                                DateTime.now();\n                            final pickedDate = await showDatePicker(\n                              context: dialogContext,\n                              initialDate: initial,\n                              firstDate: DateTime(2000),\n                              lastDate: DateTime(2100),\n                              helpText: 'Selecionar data de fim',\n                            );\n                            if (pickedDate == null || !dialogContext.mounted) {\n                              return;\n                            }\n                            final pickedTime = await showTimePicker(\n                              context: dialogContext,\n                              initialTime: TimeOfDay.fromDateTime(initial),\n                              helpText: 'Selecionar hora de fim',\n                            );\n                            if (!dialogContext.mounted) return;\n                            final time =\n                                pickedTime ?? TimeOfDay.fromDateTime(initial);\n                            setDialogState(() {\n                              endsAt = DateTime(\n                                pickedDate.year,\n                                pickedDate.month,\n                                pickedDate.day,\n                                time.hour,\n                                time.minute,\n                              );\n                            });\n                          },\n                    child: InputDecorator(\n                      decoration: InputDecoration(\n                        labelText: 'Fim — data e hora (opcional)',\n                        prefixIcon: const Icon(Icons.event_available_outlined),\n                        suffixIcon: endsAt == null\n                            ? const Icon(Icons.edit_calendar_outlined)\n                            : IconButton(\n                                tooltip: 'Remover data de fim',\n                                onPressed: saving\n                                    ? null\n                                    : () =>\n                                          setDialogState(() => endsAt = null),\n                                icon: const Icon(Icons.clear),\n                              ),\n                      ),\n                      child: Text(\n                        endsAt == null\n                            ? 'Sem data de fim definida'\n                            : _dateTimePt(endsAt!),\n                      ),\n                    ),\n                  ),\n                  const SizedBox(height: 10),\n                  TextField(\n                    controller: description,\n"""
          if text.count(old) != 1:
              raise SystemExit(f'end date insertion anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = """                  const SizedBox(height: 10),\n                  DropdownButtonFormField<String>(\n                    initialValue: status,\n"""
          new = """                  const SizedBox(height: 10),\n                  TextField(\n                    controller: capacity,\n                    keyboardType: TextInputType.number,\n                    decoration: const InputDecoration(\n                      labelText: 'Capacidade prevista (opcional)',\n                      prefixIcon: Icon(Icons.groups_outlined),\n                    ),\n                  ),\n                  const SizedBox(height: 10),\n                  DropdownButtonFormField<String>(\n                    initialValue: status,\n"""
          if text.count(old) != 1:
              raise SystemExit(f'capacity insertion anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = """                      setDialogState(() => saving = true);\n                      try {\n                        await _events.saveEvent({\n"""
          new = """                      if (endsAt != null && !endsAt!.isAfter(startsAt!)) {\n                        ScaffoldMessenger.of(dialogContext).showSnackBar(\n                          const SnackBar(\n                            content: Text(\n                              'A data de fim tem de ser posterior ao início.',\n                            ),\n                          ),\n                        );\n                        return;\n                      }\n                      final capacityText = capacity.text.trim();\n                      final parsedCapacity = capacityText.isEmpty\n                          ? null\n                          : int.tryParse(capacityText);\n                      if (capacityText.isNotEmpty &&\n                          (parsedCapacity == null || parsedCapacity <= 0)) {\n                        ScaffoldMessenger.of(dialogContext).showSnackBar(\n                          const SnackBar(\n                            content: Text(\n                              'A capacidade tem de ser um número inteiro superior a zero.',\n                            ),\n                          ),\n                        );\n                        return;\n                      }\n                      setDialogState(() => saving = true);\n                      try {\n                        await _events.saveEvent({\n"""
          if text.count(old) != 1:
              raise SystemExit(f'validation anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = """                          'starts_at': startsAt!.toIso8601String(),\n                          'budget':\n"""
          new = """                          'starts_at': startsAt!.toIso8601String(),\n                          'ends_at': endsAt?.toIso8601String(),\n                          'event_kind': eventKind,\n                          'capacity': parsedCapacity,\n                          'budget':\n"""
          if text.count(old) != 1:
              raise SystemExit(f'payload anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = """    description.dispose();\n    budget.dispose();\n    if (saved == true && mounted) setState(_reload);\n"""
          new = """    description.dispose();\n    budget.dispose();\n    capacity.dispose();\n    if (saved == true && mounted) setState(_reload);\n"""
          if text.count(old) != 1:
              raise SystemExit(f'dispose anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = """                    subtitle: Text(\n                      _dateTimePt(_parseDate(widget.event['starts_at'])),\n                    ),\n                    trailing: Chip(\n"""
          new = """                    subtitle: Column(\n                      crossAxisAlignment: CrossAxisAlignment.start,\n                      children: [\n                        Text(\n                          'Tipo: ${_eventKindLabel(widget.event['event_kind'])}',\n                        ),\n                        Text(\n                          'Início: ${_dateTimePt(_parseDate(widget.event['starts_at']))}',\n                        ),\n                        if (_parseDate(widget.event['ends_at']) != null)\n                          Text(\n                            'Fim: ${_dateTimePt(_parseDate(widget.event['ends_at']))}',\n                          ),\n                        if (widget.event['capacity'] != null)\n                          Text('Capacidade: ${widget.event['capacity']} pessoas'),\n                      ],\n                    ),\n                    trailing: Chip(\n"""
          if text.count(old) != 1:
              raise SystemExit(f'detail anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = """String _normalizeStatus(String? value) {\n"""
          new = """String _normalizeEventKind(String? value) => switch (value) {\n  'ride' => 'ride',\n  'rock_ride_in' => 'rock_ride_in',\n  _ => 'general',\n};\n\nString _eventKindLabel(Object? value) => switch (value?.toString()) {\n  'ride' => 'Passeio',\n  'rock_ride_in' => 'Rock & Ride In',\n  _ => 'Evento',\n};\n\nString _normalizeStatus(String? value) {\n"""
          if text.count(old) != 1:
              raise SystemExit(f'helper anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          screen.write_text(text, encoding='utf-8')

          repo = Path('apps/mobile/lib/repositories/events_repository.dart')
          text = repo.read_text(encoding='utf-8')

          old = """    final status = values['status']?.toString() ?? 'draft';\n    const allowedStatuses = {\n"""
          new = """    final endsAt = _parseDate(values['ends_at']);\n    if (endsAt != null && !endsAt.isAfter(startsAt)) {\n      throw ArgumentError('A data de fim tem de ser posterior ao início.');\n    }\n\n    final eventKind = values['event_kind']?.toString() ?? 'general';\n    const allowedEventKinds = {'general', 'ride', 'rock_ride_in'};\n    if (!allowedEventKinds.contains(eventKind)) {\n      throw ArgumentError('Tipo de evento inválido.');\n    }\n\n    int? capacity;\n    final capacityValue = values['capacity'];\n    if (capacityValue != null && capacityValue.toString().trim().isNotEmpty) {\n      capacity = capacityValue is int\n          ? capacityValue\n          : int.tryParse(capacityValue.toString());\n      if (capacity == null || capacity <= 0) {\n        throw ArgumentError(\n          'A capacidade tem de ser um número inteiro superior a zero.',\n        );\n      }\n    }\n\n    final status = values['status']?.toString() ?? 'draft';\n    const allowedStatuses = {\n"""
          if text.count(old) != 1:
              raise SystemExit(f'repository validation anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = """      'starts_at': startsAt.toUtc().toIso8601String(),\n      'status': status,\n      'budget': _asDouble(values['budget']),\n"""
          new = """      'starts_at': startsAt.toUtc().toIso8601String(),\n      'ends_at': endsAt?.toUtc().toIso8601String(),\n      'event_kind': eventKind,\n      'capacity': capacity,\n      'status': status,\n      'budget': _asDouble(values['budget']),\n"""
          if text.count(old) != 1:
              raise SystemExit(f'repository normalized anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          old = """      'ends_at': normalized['ends_at'],\n      'status': normalized['status'],\n      'capacity': normalized['capacity'] ?? normalized['expected_attendance'],\n"""
          new = """      'ends_at': normalized['ends_at'],\n      'event_kind': normalized['event_kind'],\n      'status': normalized['status'],\n      'capacity': normalized['capacity'],\n"""
          if text.count(old) != 1:
              raise SystemExit(f'repository payload anchor count={text.count(old)}')
          text = text.replace(old, new, 1)

          repo.write_text(text, encoding='utf-8')
          PY
          dart format apps/mobile/lib/screens/events_agenda_v2_screen.dart apps/mobile/lib/repositories/events_repository.dart
      - name: Validate Flutter
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release
      - name: Commit base event fields
        shell: bash
        run: |
          rm .github/workflows/temp-complete-event-base-fields.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/mobile/lib/screens/events_agenda_v2_screen.dart apps/mobile/lib/repositories/events_repository.dart .github/workflows/temp-complete-event-base-fields.yml
          git commit -m 'feat(events): complete base event fields'
          git push origin rc1-rebuild
