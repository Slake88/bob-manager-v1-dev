name: Temporary event participant management integration

on:
  push:
    branches: [rc1-rebuild]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Patch source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile/lib/screens/events_module_screen.dart')
          text = path.read_text()

          old_import = "import 'events_screen.dart';\nimport 'roadbook_stops_screen.dart';"
          new_import = "import 'events_agenda_v2_screen.dart';\nimport 'events_screen.dart';\nimport 'roadbook_stops_screen.dart';"
          if old_import not in text:
              raise SystemExit('expected imports not found')
          text = text.replace(old_import, new_import, 1)

          old_tile = """              _HubTile(\n                icon: Icons.people_alt_outlined,\n                title: 'Acompanhantes',\n                subtitle: '${data['guests']} registado(s)',\n                onTap: () => _open(\n                  _GuestsPage(eventId: _eventId, repository: widget.repository),\n                ),\n              ),"""
          new_tile = """              _HubTile(\n                icon: Icons.groups_outlined,\n                title: 'Participantes e acompanhantes',\n                subtitle: 'Gerir inscrições e acompanhantes',\n                onTap: () => _open(\n                  EventDetailV2Screen(\n                    event: widget.event,\n                    repository: _events,\n                    memberRepository: MemberRepository(),\n                  ),\n                ),\n              ),"""
          if old_tile not in text:
              raise SystemExit('expected companion tile not found')
          text = text.replace(old_tile, new_tile, 1)
          path.write_text(text)
          PY
      - name: Validate
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release
      - name: Commit integration
        shell: bash
        run: |
          rm .github/workflows/temp-event-participants-management.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/screens/events_module_screen.dart .github/workflows/temp-event-participants-management.yml
          git commit -m "feat(events): manage participants from event operations"
          git push origin HEAD:rc1-rebuild
