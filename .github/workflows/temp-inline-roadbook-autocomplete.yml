name: Temporary inline roadbook autocomplete

on:
  push:
    branches:
      - rc1-rebuild
    paths:
      - .github/workflows/temp-inline-roadbook-autocomplete.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild
          fetch-depth: 0

      - name: Add inline Google Places autocomplete
        run: python tools/temp_patch_inline_autocomplete.py

      - name: Commit patch and remove temporary files
        shell: bash
        run: |
          rm .github/workflows/temp-inline-roadbook-autocomplete.yml
          rm tools/temp_patch_inline_autocomplete.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/screens/roadbook_stops_screen.dart .github/workflows/temp-inline-roadbook-autocomplete.yml tools/temp_patch_inline_autocomplete.py
          git commit -m "fix(events): autocomplete roadbook locations inline"
          git push origin HEAD:rc1-rebuild
