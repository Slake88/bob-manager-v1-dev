name: Temporary event participant attendance integration

on:
  push:
    branches:
      - rc1-rebuild
    paths:
      - .github/workflows/temp-event-participant-attendance.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Patch source
        run: python3 .github/scripts/temp_event_participant_attendance.py
      - name: Fix generated helper syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('apps/mobile/lib/screens/events_agenda_v2_screen.dart')
          text = path.read_text()
          bad = "String _normalizeRegistrationStatus(Object? value) => switch (\n  value?.toString(),\n) {"
          good = "String _normalizeRegistrationStatus(Object? value) => switch (value?.toString()) {"
          if bad not in text:
              raise SystemExit('generated helper syntax marker not found')
          path.write_text(text.replace(bad, good, 1))
          PY
      - name: Validate
        working-directory: apps/mobile
        run: |
          flutter pub get
          dart format lib/repositories/event_participation_repository.dart lib/screens/events_agenda_v2_screen.dart
          flutter analyze
          flutter test
          flutter build web --release
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-event-participant-attendance.yml .github/scripts/temp_event_participant_attendance.py
          git add apps/mobile/lib/repositories/event_participation_repository.dart apps/mobile/lib/screens/events_agenda_v2_screen.dart apps/mobile/pubspec.lock
          git commit -m "feat(events): add participant status check-in and notes"
          git push origin HEAD:rc1-rebuild
