name: RC1 Guest Attendance Patch

on:
  push:
    branches:
      - rc1-rebuild
    paths:
      - .github/workflows/rc1_guest_attendance_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild

      - name: Apply companion attendance integration
        run: python3 tools/rc1_guest_attendance_patch.py

      - name: Remove temporary helpers
        run: git rm .github/workflows/rc1_guest_attendance_patch.yml tools/rc1_guest_attendance_patch.py

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit companion attendance support
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/repositories/event_participation_repository.dart apps/mobile/lib/screens/events_agenda_v2_screen.dart .github/workflows/rc1_guest_attendance_patch.yml tools/rc1_guest_attendance_patch.py
          git commit -m "feat(events): manage companion attendance individually"
          git push origin HEAD:rc1-rebuild
