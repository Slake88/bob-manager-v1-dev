name: RC1 Guest Attendance Patch

on:
  push:
    branches:
      - rc1-rebuild
    paths:
      - .github/workflows/rc1_guest_attendance_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild

      - name: Apply companion attendance integration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_one(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          repo_path = Path('apps/mobile/lib/repositories/event_participation_repository.dart')
          repo = repo_path.read_text()
          repo = replace_one(
              repo,
              "          'event_registration_guests(id,guest_name,created_at)',",
              "          'event_registration_guests(id,guest_name,status,checked_in_at,notes,created_at)',",
              'guest attendance select',
          )

          companion_method = '''  Future<void> updateCompanion({
            required String eventId,
            required String companionId,
            required String status,
            required String? notes,
            required DateTime? checkedInAt,
          }) async {
            if (!canManageAll) {
              throw StateError('Sem permissão para gerir este acompanhante.');
            }

            final normalizedStatus = status.trim();
            if (normalizedStatus != 'confirmed' && normalizedStatus != 'pending') {
              throw ArgumentError('O estado do acompanhante não é válido.');
            }
            if (normalizedStatus != 'confirmed' && checkedInAt != null) {
              throw ArgumentError(
                'Só é possível registar presença num acompanhante confirmado.',
              );
            }

            final normalizedNotes = notes?.trim();
            if (AppConfig.demoMode) return;

            try {
              await _client.rpc(
                'update_event_guest_attendance_v1',
                params: {
                  'p_event': eventId,
                  'p_guest': companionId,
                  'p_status': normalizedStatus,
                  'p_notes': normalizedNotes == null || normalizedNotes.isEmpty
                      ? null
                      : normalizedNotes,
                  'p_checked_in_at': checkedInAt?.toUtc().toIso8601String(),
                },
              );
            } on PostgrestException catch (error) {
              throw StateError(_friendly(error));
            }
          }

'''
          repo = replace_one(
              repo,
              '  Future<void> cancelRegistration(String registrationId) async {',
              companion_method + '  Future<void> cancelRegistration(String registrationId) async {',
              'guest attendance writer',
          )
          repo = replace_one(
              repo,
              "    if (text.contains('event_capacity_reached')) {\n      return 'O evento atingiu a capacidade máxima. Não existem lugares disponíveis.';\n    }",
              "    if (text.contains('event_capacity_reached')) {\n      return 'O evento atingiu a capacidade máxima. Não existem lugares disponíveis.';\n    }\n    if (text.contains('guest_not_found_for_event') ||\n        text.contains('guest_registration_not_found')) {\n      return 'Acompanhante não encontrado neste evento.';\n    }\n    if (text.contains('guest_checkin_requires_confirmed_status')) {\n      return 'Só é possível registar presença num acompanhante confirmado.';\n    }\n    if (text.contains('guest_status_invalid')) {\n      return 'O estado do acompanhante não é válido.';\n    }",
              'guest attendance friendly errors',
          )
          repo_path.write_text(repo)

          ui_path = Path('apps/mobile/lib/screens/events_agenda_v2_screen.dart')
          ui = ui_path.read_text()

          guest_methods = '''  Future<void> _editCompanion(
            Map<String, dynamic> companion,
          ) async {
            String status = _normalizeRegistrationStatus(companion['status']);
            final notes = TextEditingController(
              text: companion['notes']?.toString() ?? '',
            );
            DateTime? checkedInAt = _parseDate(companion['checked_in_at']);
            bool saving = false;

            final saved = await showDialog<bool>(
              context: context,
              builder: (dialogContext) => StatefulBuilder(
                builder: (context, setDialogState) => AlertDialog(
                  title: Text(
                    'Gerir acompanhante — '
                    '${companion['guest_name']?.toString() ?? 'Acompanhante'}',
                  ),
                  content: SizedBox(
                    width: 480,
                    child: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          DropdownButtonFormField<String>(
                            initialValue: status,
                            decoration: const InputDecoration(
                              labelText: 'Estado',
                              prefixIcon: Icon(Icons.fact_check_outlined),
                            ),
                            items: const [
                              DropdownMenuItem(
                                value: 'confirmed',
                                child: Text('Confirmado'),
                              ),
                              DropdownMenuItem(
                                value: 'pending',
                                child: Text('Pendente'),
                              ),
                            ],
                            onChanged: saving
                                ? null
                                : (value) {
                                    if (value == null) return;
                                    setDialogState(() {
                                      status = value;
                                      if (status != 'confirmed') {
                                        checkedInAt = null;
                                      }
                                    });
                                  },
                          ),
                          const SizedBox(height: 10),
                          SwitchListTile.adaptive(
                            contentPadding: EdgeInsets.zero,
                            title: const Text('Check-in / presença'),
                            subtitle: Text(
                              checkedInAt == null
                                  ? 'Presença ainda não registada'
                                  : 'Registado em ${_dateTimePt(checkedInAt)}',
                            ),
                            value: checkedInAt != null,
                            onChanged: saving || status != 'confirmed'
                                ? null
                                : (value) {
                                    setDialogState(() {
                                      checkedInAt = value ? DateTime.now() : null;
                                    });
                                  },
                          ),
                          const SizedBox(height: 10),
                          TextField(
                            controller: notes,
                            minLines: 2,
                            maxLines: 4,
                            decoration: const InputDecoration(
                              labelText: 'Notas operacionais (opcional)',
                              prefixIcon: Icon(Icons.notes_outlined),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                  actions: [
                    TextButton(
                      onPressed: saving
                          ? null
                          : () => Navigator.pop(dialogContext, false),
                      child: const Text('Cancelar'),
                    ),
                    FilledButton.icon(
                      onPressed: saving
                          ? null
                          : () async {
                              setDialogState(() => saving = true);
                              try {
                                await _participation.updateCompanion(
                                  eventId: widget.event['id'].toString(),
                                  companionId: companion['id'].toString(),
                                  status: status,
                                  notes: notes.text,
                                  checkedInAt: checkedInAt,
                                );
                                if (dialogContext.mounted) {
                                  Navigator.pop(dialogContext, true);
                                }
                              } catch (error) {
                                if (dialogContext.mounted) {
                                  ScaffoldMessenger.of(dialogContext).showSnackBar(
                                    SnackBar(
                                      content: Text(_friendlyError(error)),
                                    ),
                                  );
                                  setDialogState(() => saving = false);
                                }
                              }
                            },
                      icon: saving
                          ? const SizedBox(
                              width: 18,
                              height: 18,
                              child: CircularProgressIndicator(strokeWidth: 2),
                            )
                          : const Icon(Icons.save_outlined),
                      label: Text(saving ? 'A guardar...' : 'Guardar'),
                    ),
                  ],
                ),
              ),
            );

            notes.dispose();
            if (saved == true && mounted) {
              ScaffoldMessenger.of(context).showSnackBar(
                const SnackBar(content: Text('Acompanhante atualizado.')),
              );
              setState(_reload);
            }
          }

          Future<void> _toggleCompanionCheckIn(
            Map<String, dynamic> companion,
          ) async {
            final currentCheckIn = _parseDate(companion['checked_in_at']);
            final registeringPresence = currentCheckIn == null;
            final currentStatus = _normalizeRegistrationStatus(
              companion['status'],
            );

            try {
              await _participation.updateCompanion(
                eventId: widget.event['id'].toString(),
                companionId: companion['id'].toString(),
                status: registeringPresence ? 'confirmed' : currentStatus,
                notes: companion['notes']?.toString(),
                checkedInAt: registeringPresence ? DateTime.now() : null,
              );
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(
                  content: Text(
                    registeringPresence
                        ? (currentStatus == 'pending'
                            ? 'Check-in do acompanhante registado e estado confirmado.'
                            : 'Check-in do acompanhante registado.')
                        : 'Check-in do acompanhante anulado.',
                  ),
                ),
              );
              setState(_reload);
            } catch (error) {
              _showError(error);
            }
          }

'''
          ui = replace_one(
              ui,
              '  Future<void> _addVolunteer(_EventDetailV2Data data) async {',
              guest_methods + '  Future<void> _addVolunteer(_EventDetailV2Data data) async {',
              'guest attendance methods',
          )

          ui = replace_one(
              ui,
              "          final checkInCount = data.participants\n              .where((row) => _parseDate(row['checked_in_at']) != null)\n              .length;",
              "          final checkInCount = data.participants.fold<int>(\n            0,\n            (sum, row) =>\n                sum +\n                (_parseDate(row['checked_in_at']) != null ? 1 : 0) +\n                _companions(row)\n                    .where(\n                      (companion) =>\n                          _parseDate(companion['checked_in_at']) != null,\n                    )\n                    .length,\n          );",
              'check-in total',
          )

          old_companions = '''              if (companions.isEmpty)
                const Text('Sem acompanhantes')
              else
                Wrap(
                  spacing: 6,
                  runSpacing: 6,
                  children: companions
                      .map(
                        (companion) => InputChip(
                          avatar: const Icon(Icons.group_outlined, size: 16),
                          label: Text(
                            companion['guest_name']?.toString() ??
                                'Acompanhante',
                          ),
                          onDeleted: canEditCompanions
                              ? () => _removeCompanion(companion)
                              : null,
                        ),
                      )
                      .toList(),
                ),'''

          new_companions = '''              if (companions.isEmpty)
                const Text('Sem acompanhantes')
              else ...[
                Text(
                  'Acompanhantes',
                  style: Theme.of(context).textTheme.labelLarge,
                ),
                const SizedBox(height: 4),
                ...companions.map((companion) {
                  final companionStatus = _normalizeRegistrationStatus(
                    companion['status'],
                  );
                  final companionCheckIn = _parseDate(
                    companion['checked_in_at'],
                  );
                  final companionNotes =
                      companion['notes']?.toString().trim() ?? '';
                  return Padding(
                    padding: const EdgeInsets.only(bottom: 6),
                    child: Container(
                      padding: const EdgeInsets.all(10),
                      decoration: BoxDecoration(
                        border: Border.all(
                          color: Theme.of(context).colorScheme.outlineVariant,
                        ),
                        borderRadius: BorderRadius.circular(10),
                      ),
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Row(
                            children: [
                              const Icon(Icons.group_outlined, size: 18),
                              const SizedBox(width: 8),
                              Expanded(
                                child: Text(
                                  companion['guest_name']?.toString() ??
                                      'Acompanhante',
                                  style: Theme.of(context).textTheme.titleSmall,
                                ),
                              ),
                              if (canEditCompanions)
                                IconButton(
                                  tooltip: 'Remover acompanhante',
                                  visualDensity: VisualDensity.compact,
                                  onPressed: () => _removeCompanion(companion),
                                  icon: const Icon(
                                    Icons.person_remove_outlined,
                                    size: 18,
                                  ),
                                ),
                            ],
                          ),
                          Wrap(
                            spacing: 6,
                            runSpacing: 6,
                            children: [
                              Chip(
                                visualDensity: VisualDensity.compact,
                                avatar: Icon(
                                  companionStatus == 'confirmed'
                                      ? Icons.verified_outlined
                                      : Icons.schedule_outlined,
                                  size: 16,
                                ),
                                label: Text(
                                  _registrationStatusLabel(companionStatus),
                                ),
                              ),
                              if (companionCheckIn != null)
                                Chip(
                                  visualDensity: VisualDensity.compact,
                                  avatar: const Icon(
                                    Icons.how_to_reg_outlined,
                                    size: 16,
                                  ),
                                  label: Text(
                                    'Presente • ${_dateTimePt(companionCheckIn)}',
                                  ),
                                ),
                            ],
                          ),
                          if (_canManage && companionNotes.isNotEmpty) ...[
                            const SizedBox(height: 6),
                            Text('Notas: $companionNotes'),
                          ],
                          if (_canManage) ...[
                            const SizedBox(height: 6),
                            Wrap(
                              spacing: 8,
                              runSpacing: 6,
                              children: [
                                FilledButton.tonalIcon(
                                  onPressed: () =>
                                      _toggleCompanionCheckIn(companion),
                                  icon: Icon(
                                    companionCheckIn == null
                                        ? Icons.how_to_reg_outlined
                                        : Icons.undo_outlined,
                                    size: 18,
                                  ),
                                  label: Text(
                                    companionCheckIn == null
                                        ? 'Check-in'
                                        : 'Anular check-in',
                                  ),
                                ),
                                OutlinedButton.icon(
                                  onPressed: () => _editCompanion(companion),
                                  icon: const Icon(
                                    Icons.edit_note_outlined,
                                    size: 18,
                                  ),
                                  label: const Text('Estado / notas'),
                                ),
                              ],
                            ),
                          ],
                        ],
                      ),
                    ),
                  );
                }),
              ],'''
          ui = replace_one(
              ui,
              old_companions,
              new_companions,
              'guest attendance cards',
          )
          ui_path.write_text(ui)
          PY

      - name: Remove temporary workflow
        run: git rm .github/workflows/rc1_guest_attendance_patch.yml

      - name: Validate patch whitespace
        run: git diff --check

      - name: Commit companion attendance support
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/repositories/event_participation_repository.dart apps/mobile/lib/screens/events_agenda_v2_screen.dart .github/workflows/rc1_guest_attendance_patch.yml
          git commit -m "feat(events): manage companion attendance individually"
          git push origin HEAD:rc1-rebuild
