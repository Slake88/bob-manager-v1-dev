name: Temporary event operations RC1 integration

on:
  push:
    branches:
      - rc1-rebuild
    paths:
      - .github/workflows/temp-event-operations-rc1.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Patch event operations
        run: python3 .github/scripts/temp_event_operations_rc1.py
      - name: Fix generated operations syntax
        run: python3 .github/scripts/temp_event_operations_fix.py
      - name: Clean legacy operations helpers
        run: python3 .github/scripts/temp_event_operations_cleanup.py
      - name: Format
        working-directory: apps/mobile
        run: dart format lib/repositories/events_advanced_repository.dart lib/screens/events_module_screen.dart
      - name: Validate
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/repositories/events_advanced_repository.dart apps/mobile/lib/screens/events_module_screen.dart
          git commit -m "feat(events): complete volunteer task and shift operations"
          git push origin rc1-rebuild
