name: Wire enhanced Roadbook stop screen

on:
  push:
    branches: [rc1-rebuild]
    paths:
      - '.github/workflows/roadbook-ui-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild
          fetch-depth: 0
      - name: Patch events module
        shell: python
        run: |
          from pathlib import Path

          path = Path('apps/mobile/lib/screens/events_module_screen.dart')
          text = path.read_text(encoding='utf-8')

          import_anchor = "import 'events_screen.dart';"
          if "import 'roadbook_stops_screen.dart';" not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('Expected events screen import exactly once')
              text = text.replace(
                  import_anchor,
                  import_anchor + "\nimport 'roadbook_stops_screen.dart';",
                  1,
              )

          old_builder = "builder: (_) => _RouteStopsPage("
          new_builder = "builder: (_) => RoadbookStopsScreen("
          if text.count(old_builder) != 1:
              raise SystemExit(
                  f'Expected old Roadbook stops builder exactly once, got {text.count(old_builder)}'
              )
          text = text.replace(old_builder, new_builder, 1)

          path.write_text(text, encoding='utf-8')
      - name: Commit patch
        run: |
          git config user.name "BOB Manager Automation"
          git config user.email "actions@users.noreply.github.com"
          git add apps/mobile/lib/screens/events_module_screen.dart
          git rm .github/workflows/roadbook-ui-patch.yml
          git commit -m "feat(events): use enhanced roadbook stop screen"
          git push origin HEAD:rc1-rebuild
