name: Patch PDF Euro
on:
  push:
    branches: [rc1-rebuild]
    paths:
      - '.github/workflows/patch_pdf_euro.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild
      - name: Apply Unicode font to treasury PDF
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/mobile/lib/screens/treasury_reports_screen.dart')
          s = p.read_text(encoding='utf-8')
          old = """  Future<void> _exportPdf(TreasuryReportData data) async {
    final document = pw.Document();
    final tableData = <List<dynamic>>[
"""
          new = """  Future<void> _exportPdf(TreasuryReportData data) async {
    final regularFont = await PdfGoogleFonts.robotoRegular();
    final boldFont = await PdfGoogleFonts.robotoBold();
    final document = pw.Document(
      theme: pw.ThemeData.withFont(base: regularFont, bold: boldFont),
    );
    final tableData = <List<dynamic>>[
"""
          if old not in s:
              raise SystemExit('Bloco _exportPdf não encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          git add apps/mobile/lib/screens/treasury_reports_screen.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: corrigir símbolo euro no PDF financeiro"
          git push origin HEAD:rc1-rebuild
