name: Temporary robust event tab refresh

on:
  push:
    branches:
      - rc1-rebuild
    paths:
      - '.github/workflows/temp-format-management-delete.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Force refresh after tab switch frame
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          targets = [
              Path('apps/mobile/lib/screens/events_module_screen.dart'),
              Path('apps/mobile/lib/screens/events_screen.dart'),
          ]

          old = '''    if (oldWidget.refreshToken != widget.refreshToken) {
      _reload();
    }
'''
          new = '''    if (oldWidget.refreshToken != widget.refreshToken) {
      WidgetsBinding.instance.addPostFrameCallback((_) {
        if (mounted) setState(_reload);
      });
    }
'''

          for path in targets:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected 1 refresh anchor, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          dart format apps/mobile/lib/screens/events_module_screen.dart apps/mobile/lib/screens/events_screen.dart
          rm .github/workflows/temp-format-management-delete.yml
      - name: Validate Flutter
        working-directory: apps/mobile
        shell: bash
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release
      - name: Commit robust refresh
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/screens/events_module_screen.dart apps/mobile/lib/screens/events_screen.dart .github/workflows/temp-format-management-delete.yml
          git commit -m "fix(events): force refresh after event tab switch"
          git push origin rc1-rebuild
