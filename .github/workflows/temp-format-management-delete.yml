name: Temporary event refresh

on:
  push:
    branches:
      - rc1-rebuild

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Patch refresh lifecycle
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          pattern = re.compile(
              r"if \(oldWidget\.refreshToken != widget\.refreshToken\) \{\s*_reload\(\);\s*\}",
              re.MULTILINE,
          )
          replacement = """if (oldWidget.refreshToken != widget.refreshToken) {
              WidgetsBinding.instance.addPostFrameCallback((_) {
                if (mounted) setState(_reload);
              });
            }"""

          for filename in [
              'apps/mobile/lib/screens/events_module_screen.dart',
              'apps/mobile/lib/screens/events_screen.dart',
          ]:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text, count = pattern.subn(replacement, text, count=1)
              if count != 1:
                  raise SystemExit(f'{filename}: refresh pattern count={count}')
              path.write_text(text, encoding='utf-8')
          PY
          dart format apps/mobile/lib/screens/events_module_screen.dart apps/mobile/lib/screens/events_screen.dart
          rm .github/workflows/temp-format-management-delete.yml
      - name: Validate Flutter
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/screens/events_module_screen.dart apps/mobile/lib/screens/events_screen.dart .github/workflows/temp-format-management-delete.yml
          git commit -m "fix(events): force refresh after event tab switch"
          git push origin rc1-rebuild
