name: Temporary event tab sync

on:
  push:
    branches:
      - rc1-rebuild
    paths:
      - '.github/workflows/temp-format-management-delete.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Synchronize Agenda and Gestão refresh
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          module = Path('apps/mobile/lib/screens/events_module_screen.dart')
          text = module.read_text(encoding='utf-8')
          old = (
              "class _EventsModuleScreenState extends State<EventsModuleScreen> {\n"
              "  int _index = 0;\n"
              "\n"
              "  @override\n"
              "  Widget build(BuildContext context) {\n"
              "    return Scaffold(\n"
              "      body: IndexedStack(\n"
              "        index: _index,\n"
              "        children: const [EventsScreen(), EventsAdvancedHomeScreen()],\n"
              "      ),\n"
              "      bottomNavigationBar: NavigationBar(\n"
              "        selectedIndex: _index,\n"
              "        onDestinationSelected: (value) => setState(() => _index = value),\n"
          )
          new = (
              "class _EventsModuleScreenState extends State<EventsModuleScreen> {\n"
              "  int _index = 0;\n"
              "  int _agendaRefreshToken = 0;\n"
              "  int _managementRefreshToken = 0;\n"
              "\n"
              "  void _selectTab(int value) {\n"
              "    if (value == _index) return;\n"
              "    setState(() {\n"
              "      _index = value;\n"
              "      if (value == 0) {\n"
              "        _agendaRefreshToken++;\n"
              "      } else {\n"
              "        _managementRefreshToken++;\n"
              "      }\n"
              "    });\n"
              "  }\n"
              "\n"
              "  @override\n"
              "  Widget build(BuildContext context) {\n"
              "    return Scaffold(\n"
              "      body: IndexedStack(\n"
              "        index: _index,\n"
              "        children: [\n"
              "          EventsScreen(refreshToken: _agendaRefreshToken),\n"
              "          EventsAdvancedHomeScreen(\n"
              "            refreshToken: _managementRefreshToken,\n"
              "          ),\n"
              "        ],\n"
              "      ),\n"
              "      bottomNavigationBar: NavigationBar(\n"
              "        selectedIndex: _index,\n"
              "        onDestinationSelected: _selectTab,\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'module state anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = (
              "class EventsAdvancedHomeScreen extends StatefulWidget {\n"
              "  const EventsAdvancedHomeScreen({super.key});\n"
              "\n"
              "  @override\n"
          )
          new = (
              "class EventsAdvancedHomeScreen extends StatefulWidget {\n"
              "  const EventsAdvancedHomeScreen({super.key, this.refreshToken = 0});\n"
              "\n"
              "  final int refreshToken;\n"
              "\n"
              "  @override\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'advanced constructor anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          state_start = text.index('class _EventsAdvancedHomeScreenState')
          state_end = text.index('class EventProposalsScreen', state_start)
          segment = text[state_start:state_end]
          old = (
              "  @override\n"
              "  void initState() {\n"
              "    super.initState();\n"
              "    _reload();\n"
              "  }\n"
              "\n"
              "  void _reload() {\n"
          )
          new = (
              "  @override\n"
              "  void initState() {\n"
              "    super.initState();\n"
              "    _reload();\n"
              "  }\n"
              "\n"
              "  @override\n"
              "  void didUpdateWidget(covariant EventsAdvancedHomeScreen oldWidget) {\n"
              "    super.didUpdateWidget(oldWidget);\n"
              "    if (oldWidget.refreshToken != widget.refreshToken) {\n"
              "      _reload();\n"
              "    }\n"
              "  }\n"
              "\n"
              "  void _reload() {\n"
          )
          if segment.count(old) != 1:
              raise SystemExit(f'advanced init anchor count={segment.count(old)}')
          segment = segment.replace(old, new, 1)
          text = text[:state_start] + segment + text[state_end:]
          module.write_text(text, encoding='utf-8')
          agenda = Path('apps/mobile/lib/screens/events_screen.dart')
          text = agenda.read_text(encoding='utf-8')
          old = (
              "class EventsScreen extends StatefulWidget {\n"
              "  const EventsScreen({super.key});\n"
              "\n"
              "  @override\n"
          )
          new = (
              "class EventsScreen extends StatefulWidget {\n"
              "  const EventsScreen({super.key, this.refreshToken = 0});\n"
              "\n"
              "  final int refreshToken;\n"
              "\n"
              "  @override\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'agenda constructor anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          old = (
              "  @override\n"
              "  void initState() {\n"
              "    super.initState();\n"
              "    final now = DateTime.now();\n"
              "    _month = DateTime(now.year, now.month);\n"
              "    _reload();\n"
              "  }\n"
              "\n"
              "  void _reload() {\n"
          )
          new = (
              "  @override\n"
              "  void initState() {\n"
              "    super.initState();\n"
              "    final now = DateTime.now();\n"
              "    _month = DateTime(now.year, now.month);\n"
              "    _reload();\n"
              "  }\n"
              "\n"
              "  @override\n"
              "  void didUpdateWidget(covariant EventsScreen oldWidget) {\n"
              "    super.didUpdateWidget(oldWidget);\n"
              "    if (oldWidget.refreshToken != widget.refreshToken) {\n"
              "      _reload();\n"
              "    }\n"
              "  }\n"
              "\n"
              "  void _reload() {\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'agenda init anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          agenda.write_text(text, encoding='utf-8')
          PY
          dart format apps/mobile/lib/screens/events_module_screen.dart apps/mobile/lib/screens/events_screen.dart
          rm .github/workflows/temp-format-management-delete.yml
          rm -f .github/workflows/temp-sync-event-tabs.yml
      - name: Validate Flutter
        working-directory: apps/mobile
        shell: bash
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Commit synchronization
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/screens/events_module_screen.dart apps/mobile/lib/screens/events_screen.dart .github/workflows/temp-format-management-delete.yml .github/workflows/temp-sync-event-tabs.yml
          git commit -m "fix(events): refresh agenda and management on tab switch"
          git push origin rc1-rebuild
