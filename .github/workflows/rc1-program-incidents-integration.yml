name: RC1 Program Incidents Integration

on:
  push:
    branches: [rc1-rebuild]
    paths:
      - .github/workflows/rc1-program-incidents-integration.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild
          fetch-depth: 0

      - name: Apply source integration
        run: |
          python3 .github/scripts/rc1_program_incidents_patch.py
          python3 .github/scripts/rc1_program_incidents_fix.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Format changed Dart files
        run: dart format apps/mobile/lib/repositories/events_advanced_repository.dart apps/mobile/lib/screens/events_module_screen.dart

      - name: Resolve dependencies
        working-directory: apps/mobile
        run: flutter pub get

      - name: Analyze
        working-directory: apps/mobile
        run: flutter analyze

      - name: Test
        working-directory: apps/mobile
        run: flutter test

      - name: Build web
        working-directory: apps/mobile
        run: flutter build web --release --dart-define=DEMO_MODE=true

      - name: Commit integration and remove temporary automation
        run: |
          git checkout -- apps/mobile/pubspec.lock || true
          rm -f .github/scripts/rc1_program_incidents_patch.py
          rm -f .github/scripts/rc1_program_incidents_fix.py
          rm -f .github/workflows/rc1-program-incidents-integration.yml
          rm -f .github/rc1-program-incidents-analyze.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(events): complete program and incident operations"
          git push origin HEAD:rc1-rebuild
