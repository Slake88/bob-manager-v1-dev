name: Temporary active event V2 refresh

on:
  push:
    branches:
      - rc1-rebuild

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Patch active event tabs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          module = Path('apps/mobile/lib/screens/events_module_v2_screen.dart')
          text = module.read_text(encoding='utf-8')
          text = text.replace(
              "  int _index = 0;\n",
              "  int _index = 0;\n  int _agendaRefreshToken = 0;\n  int _managementRefreshToken = 0;\n\n  void _selectTab(int value) {\n    if (value == _index) return;\n    setState(() {\n      _index = value;\n      if (value == 0) {\n        _agendaRefreshToken++;\n      } else {\n        _managementRefreshToken++;\n      }\n    });\n  }\n",
              1,
          )
          text = text.replace(
              "        children: const [\n          EventsAgendaV2Screen(),\n          EventsAdvancedHomeScreen(),\n        ],",
              "        children: [\n          EventsAgendaV2Screen(refreshToken: _agendaRefreshToken),\n          EventsAdvancedHomeScreen(refreshToken: _managementRefreshToken),\n        ],",
              1,
          )
          text = text.replace(
              "        onDestinationSelected: (value) => setState(() => _index = value),",
              "        onDestinationSelected: _selectTab,",
              1,
          )
          if '_agendaRefreshToken' not in text or 'onDestinationSelected: _selectTab' not in text:
              raise SystemExit('events_module_v2_screen.dart was not patched')
          module.write_text(text, encoding='utf-8')

          agenda = Path('apps/mobile/lib/screens/events_agenda_v2_screen.dart')
          text = agenda.read_text(encoding='utf-8')
          ctor = "class EventsAgendaV2Screen extends StatefulWidget {\n  const EventsAgendaV2Screen({super.key});"
          replacement = "class EventsAgendaV2Screen extends StatefulWidget {\n  const EventsAgendaV2Screen({super.key, this.refreshToken = 0});\n\n  final int refreshToken;"
          if ctor not in text:
              raise SystemExit('agenda constructor anchor not found')
          text = text.replace(ctor, replacement, 1)
          lifecycle_anchor = "  void _reload() {\n    _future = _events.listMonth(_month.year, _month.month);\n  }"
          lifecycle = "  @override\n  void didUpdateWidget(covariant EventsAgendaV2Screen oldWidget) {\n    super.didUpdateWidget(oldWidget);\n    if (oldWidget.refreshToken != widget.refreshToken) {\n      _reload();\n    }\n  }\n\n  void _reload() {\n    _future = _events.listMonth(_month.year, _month.month);\n  }"
          if lifecycle_anchor not in text:
              raise SystemExit('agenda lifecycle anchor not found')
          text = text.replace(lifecycle_anchor, lifecycle, 1)
          agenda.write_text(text, encoding='utf-8')
          PY
          dart format apps/mobile/lib/screens/events_module_v2_screen.dart apps/mobile/lib/screens/events_agenda_v2_screen.dart
          rm .github/workflows/temp-event-v2-refresh.yml
      - name: Validate Flutter
        working-directory: apps/mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
          flutter build web --release
      - name: Commit fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/lib/screens/events_module_v2_screen.dart apps/mobile/lib/screens/events_agenda_v2_screen.dart .github/workflows/temp-event-v2-refresh.yml
          git commit -m "fix(events): refresh active agenda and management tabs"
          git push origin rc1-rebuild
