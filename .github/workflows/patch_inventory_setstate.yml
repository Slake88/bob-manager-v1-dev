name: Patch Inventory setState
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch_inventory_setstate.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild
      - name: Fix async setState callbacks
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/mobile/lib/screens/physical_inventory_screen.dart')
          s = p.read_text(encoding='utf-8')
          old = 'setState(_reload)'
          count = s.count(old)
          if count == 0:
              raise SystemExit('Nenhuma ocorrência setState(_reload) encontrada')
          s = s.replace(old, 'setState(() { _reload(); })')
          p.write_text(s, encoding='utf-8')
          print(f'Corrigidas {count} ocorrências')
          PY
          git diff --check
          git add apps/mobile/lib/screens/physical_inventory_screen.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "RC1: corrigir setState assíncrono no inventário físico"
          git push origin HEAD:rc1-rebuild
