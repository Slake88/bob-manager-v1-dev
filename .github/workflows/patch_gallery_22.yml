name: Patch Gallery 2.2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch_gallery_22.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc1-rebuild
      - name: Integrate gallery in product detail
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('apps/mobile/lib/screens/shop_screen.dart')
          s=p.read_text(encoding='utf-8')

          # The detail screen no longer owns image picking/upload logic.
          s=s.replace("import 'package:image_picker/image_picker.dart';\n", '')
          marker="import '../repositories/shop_repository.dart';\n"
          if "../widgets/product_image_gallery.dart" not in s:
              s=s.replace(marker, marker+"import '../widgets/product_image_gallery.dart';\n")

          # Remove the legacy single-photo picker from ProductDetailScreen only.
          start=s.find('  Future<void> _pickImage() async {', s.find('class _ProductDetailScreenState'))
          if start >= 0:
              end=s.find('  Future<void> _editVariant', start)
              if end < 0: raise SystemExit('Could not find end of legacy _pickImage')
              s=s[:start]+s[end:]

          # Remove legacy imageUrl local in detail build.
          detail=s.find('class _ProductDetailScreenState')
          target="    final imageUrl = widget.repository.publicImageUrl(_product['photo_path']);\n"
          pos=s.find(target, detail)
          if pos >= 0:
              s=s[:pos]+s[pos+len(target):]

          # Replace the legacy hero photo card with the validated multi-photo gallery.
          detail=s.find('class _ProductDetailScreenState')
          list_children=s.find('        children: [', s.find('body: ListView(', detail))
          legacy_start=s.find('          AspectRatio(\n            aspectRatio: 16 / 7,', list_children)
          legacy_end=s.find('          const SizedBox(height: 12),', legacy_start)
          if legacy_start < 0 or legacy_end < 0:
              raise SystemExit('Legacy product photo block not found')
          gallery="""          ProductImageGallery(
            repository: widget.repository,
            productId: _product['id'].toString(),
            coverPath: _product['photo_path']?.toString(),
            canManage: _canManage,
            onChanged: _reloadProduct,
          ),
"""
          s=s[:legacy_start]+gallery+s[legacy_end:]
          p.write_text(s,encoding='utf-8')
          PY

          dart format apps/mobile/lib/screens/shop_screen.dart apps/mobile/lib/repositories/product_images_repository_extension.dart
          git diff --check
          cd apps/mobile
          flutter pub get
          flutter analyze
          flutter test
          cd ../..
          git add apps/mobile/lib/screens/shop_screen.dart apps/mobile/lib/repositories/product_images_repository_extension.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "RC1: integrar Galeria 2.2 na ficha do artigo"
          git push origin HEAD:rc1-rebuild
# trigger 1
