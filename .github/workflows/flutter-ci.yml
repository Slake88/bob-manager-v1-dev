name: Flutter CI

on:
  push:
    branches: [main, fase2-integral, rc1-rebuild]
  pull_request:
    branches: [main, fase2-integral]

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build Flutter Web
        run: flutter build web --release --dart-define=DEMO_MODE=true
